name: Docker Image CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: martinc01/audiobook-manager
          tags: |
            type=raw,value={{date 'X'}}

      - name: Compute cache options
        id: cache
        run: |
          # PR-branch GHA caches are evicted after 7 days, but their manifests
          # keep referencing the missing blobs, which fails buildx on import.
          # Only reuse (and refresh) the cache from push builds on main.
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "cache-from=type=gha" >> "$GITHUB_OUTPUT"
            echo "cache-to=type=gha,mode=max" >> "$GITHUB_OUTPUT"
          else
            echo "cache-from=" >> "$GITHUB_OUTPUT"
            echo "cache-to=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build  Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=dev
            COMMIT_HASH=${{ github.sha }}
          cache-from: ${{ steps.cache.outputs.cache-from }}
          cache-to: ${{ steps.cache.outputs.cache-to }}
